name: Lawlessness

on:
  workflow_dispatch:
    inputs:
      compile_variant:
        description: 'Select Variant (DEF= with ksu)'
        required: true
        default: 'normal'
        type: choice
        options:
          - both
          - normal
          - ksu
      ignore_warnings:
        description: 'ignore all warnings?'
        required: true
        default: true
        type: boolean
jobs:
  matrix-generator:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.compile_variant }}"
          if [ "$CHOICE" = "both" ]; then
            JSON='["normal", "ksu"]'
          else
            JSON='["'"$CHOICE"'"]'
          fi
          echo "variants=$JSON" >> $GITHUB_OUTPUT
  build-kernel:
    needs: matrix-generator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix-generator.outputs.variants) }}
    name: 编译内核 (${{ matrix.variant }})
    steps:
    - name: 1. 检出云端内核源码
      uses: actions/checkout@v6
      with:
        ref: master   
    - name: 2. 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev    
    - name: 3. 拉取编译资源
      run: |
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b brillo-m9-release clang
    - name: 4. 配置环境&开始编译
      run: |
        cd $GITHUB_WORKSPACE
        export KBUILD_BUILD_USER="kleaf"
        export KBUILD_BUILD_HOST="build-host"
        export LOCALVERSION=""
        export LOCALVERSION_AUTO=y
        export KBUILD_BUILD_TIMESTAMP="$(TZ="Asia/Shanghai" date +"%a %b %d %H:%M:%S CST %Y")"
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LLVM=1 
        export LLVM_IAS=1
        if [ "${{ github.event.inputs.ignore_warnings }}" = "true" ]; then
          export KCFLAGS="-w"
        else
          export KCFLAGS=""
        fi
        make O=out y11_defconfig
        make O=out -j$(nproc --all) Image.gz
    - name: 8. 上传 Image.gz
      uses: actions/upload-artifact@v6
      with:
        name: y11-Image-${{ matrix.variant }}
        path: out/arch/arm64/boot/Image.gz
