# PD1930 (sdm439 / msm8937, Linux 4.9.227) 内核编译
#
# 编译器：Snapdragon LLVM ARM Compiler 10.0.7 for Android NDK（原机同款）
# 产物：Image.gz + dtb，别的不发。
# 无兜底：配置不对、KernelSU 集成失败、编译报错、版本串不对，全部直接失败。
#
# 版本串必须等于 4.9.227-perf+：
#   /vendor/lib/modules/wlan.ko 的 vermagic 就是 4.9.227-perf+。
#   内核版本串差一个字符，wlan.ko 就 insmod 不进去，WiFi 直接打不开。
#   这里三重锁：CONFIG_LOCALVERSION="-perf+"、关 LOCALVERSION_AUTO、make LOCALVERSION=（空）。

name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'normal = 原版内核 / ksu = 集成 KernelSU（失败即终止）'
        required: true
        default: normal
        type: choice
        options: [normal, ksu]
      ignore_warnings:
        description: '屏蔽编译警告 (-w)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  ARCH: arm64
  KERNEL_LOCALVERSION: "-perf+"
  SNAP_LLVM_REPO: https://github.com/sticpaper/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 2. 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu xz-utils

      - name: 3. 安装编译器与 binutils
        run: |
          set -e
          TC="$RUNNER_TEMP/tc"
          mkdir -p "$TC/asbin" "$TC/compat"

          # 原机同款编译器
          git clone -q --depth 1 "$SNAP_LLVM_REPO" "$TC/snap-llvm"
          "$TC/snap-llvm/bin/clang" --version | head -2

          # 这套编译器是老版本，依赖 libtinfo.so.5，新系统只有 .so.6
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 "$TC/compat/libtinfo.so.5"

          # clang 用 -no-integrated-as，需要能被 --prefix 找到的 aarch64 as/ld
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$TC/asbin/as"
          ln -sf "$(command -v aarch64-linux-gnu-ld)" "$TC/asbin/ld"
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$TC/asbin/aarch64-linux-gnu-as"
          ln -sf "$(command -v aarch64-linux-gnu-ld)" "$TC/asbin/aarch64-linux-gnu-ld"
          # 必须是真实文件：内核 Makefile 用 realpath(which ...-elfedit) 定位 as/ld 目录
          cp "$(realpath "$(command -v aarch64-linux-gnu-elfedit)")" "$TC/asbin/aarch64-linux-gnu-elfedit"

          cat > "$TC/asbin/clang" <<EOF
          #!/bin/sh
          export LD_LIBRARY_PATH="$TC/compat"
          export COMPILER_PATH="$TC/asbin"
          exec "$TC/snap-llvm/bin/clang" --target=aarch64-linux-android -B"$TC/asbin/" --prefix="$TC/asbin/" "\$@"
          EOF
          chmod +x "$TC/asbin/clang"
          "$TC/asbin/clang" --version | head -2

          echo "TC_CLANG=$TC/asbin/clang" >> "$GITHUB_ENV"
          echo "TC_CROSS=$TC/asbin/aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: 4. 集成 KernelSU
        if: inputs.variant == 'ksu'
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL -o "$RUNNER_TEMP/ksu-setup.sh" \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
          bash "$RUNNER_TEMP/ksu-setup.sh" main

      - name: 5. 配置
        run: |
          set -e
          make O=out ARCH=arm64 CC="$TC_CLANG" CROSS_COMPILE="$TC_CROSS" y11_defconfig

          # 编译必需：subsys-pil-tz.c 的 track_event 没有实现会链接失败
          scripts/config --file out/.config -e EVENT_TRACK
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config --set-str LOCALVERSION "$KERNEL_LOCALVERSION"

          make O=out ARCH=arm64 CC="$TC_CLANG" CROSS_COMPILE="$TC_CROSS" olddefconfig

          grep -q '^CONFIG_EVENT_TRACK=y' out/.config
          grep -q '^CONFIG_LOCALVERSION="-perf+"' out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config

      - name: 6. 编译
        run: |
          set -e
          KCFLAGS=""
          if [ "${{ inputs.ignore_warnings }}" = "true" ]; then KCFLAGS="-w"; fi

          make O=out ARCH=arm64 -j"$(nproc)" \
            CC="$TC_CLANG" CROSS_COMPILE="$TC_CROSS" \
            KCFLAGS="$KCFLAGS" LOCALVERSION= Image.gz dtbs

          REL="$(cat out/include/config/kernel.release)"
          echo "kernel release: $REL"
          [ "$REL" = "4.9.227-perf+" ] || {
            echo "::error::版本串是 $REL，必须是 4.9.227-perf+，否则 wlan.ko 加载失败、WiFi 打不开"
            exit 1
          }

      - name: 7. 收集产物
        run: |
          set -e
          mkdir -p artifacts/dtb
          cp out/arch/arm64/boot/Image.gz artifacts/Image.gz
          cp out/arch/arm64/boot/dts/qcom/sdm439*.dtb artifacts/dtb/
          ls -lh artifacts artifacts/dtb

      - name: 8. 上传
        uses: actions/upload-artifact@v7
        with:
          name: PD1930-${{ inputs.variant }}-kernel-dtb
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
