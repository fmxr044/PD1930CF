# ============================================================================
# PD1930CF (msm8937 / y11)  Linux 4.9.227-perf+  编译配方
#
# 一次编过的四个关键点（原配方全部踩错）：
#   1. 工具链必须是 AOSP 的 aarch64-linux-android-4.9（GCC 4.9.4 + binutils 2.25）
#      —— 不设 CC=clang、不设 LLVM=1 / LLVM_IAS=1（4.9 里这两个变量根本不存在）
#      —— CROSS_COMPILE 前缀必须和工具链包一致
#   2. CONFIG_EVENT_TRACK 必须打开，否则 drivers/soc/qcom/subsys-pil-tz.c 的
#      track_event 会 undefined reference，链接阶段直接失败
#   3. CONFIG_LOCALVERSION_AUTO 必须关，否则版本串会变成 4.9.227-perf+-g<sha>
#   4. runner 固定 ubuntu-22.04（4.9 这种老树用全新宿主编 host 工具容易出幺蛾子）
#
# 符号导出（本版新增）：
#   CONFIG_DEBUG_KERNEL + CONFIG_KALLSYMS + CONFIG_KALLSYMS_ALL = y
#   —— 4.9 的 Kconfig 里 KALLSYMS_ALL 依赖 DEBUG_KERNEL && KALLSYMS，
#      少开任何一个，olddefconfig 都会把它静默清掉，所以三个一起开、最后还校验一遍。
#   产物里额外给 System.map（全量，含 static）和 kallsyms_all.txt（nm --defined-only）。
#   vmlinux.gz 带完整 symtab，超大就自动不传。
# ============================================================================

name: Lawlessness

on:
  workflow_dispatch:
    inputs:
      compile_variant:
        description: '变体：normal = 原版内核 / ksu = 尝试集成 KernelSU / both = 两个都编'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - ksu
          - both
      ignore_warnings:
        description: '忽略编译警告（-w）'
        required: true
        default: true
        type: boolean
      source_ref:
        description: '源码分支/tag（留空 = 仓库默认分支）'
        required: false
        default: ''
      kallsyms_all:
        description: '导出全量符号（static/局部符号也进 kallsyms 和符号表）'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 先把要编的变体算出来，避免 build job 里写两遍判断
  # --------------------------------------------------------------------------
  matrix-generator:
    runs-on: ubuntu-22.04
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.compile_variant }}"
          if [ "$CHOICE" = "both" ]; then
            JSON='["normal","ksu"]'
          else
            JSON='["'"$CHOICE"'"]'
          fi
          echo "variants=$JSON" >> "$GITHUB_OUTPUT"

  build-kernel:
    needs: matrix-generator
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix-generator.outputs.variants) }}
    name: 编译内核 (${{ matrix.variant }})
    steps:
      # ----------------------------------------------------------------------
      # 1. 源码
      # ----------------------------------------------------------------------
      - name: 1. 检出内核源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.source_ref != '' && github.event.inputs.source_ref || github.event.repository.default_branch }}

      # ----------------------------------------------------------------------
      # 2. 宿主依赖（多核环境不需要 multilib，工具链是 64 位宿主程序）
      # ----------------------------------------------------------------------
      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git gnupg gperf \
            libelf-dev libssl-dev libncurses-dev lz4 lzop rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev

      # ----------------------------------------------------------------------
      # 3. 交叉工具链：AOSP GCC 4.9（实测一次编过的那套）
      #    装到 $RUNNER_TEMP，不和源码树混，避免被 git clean 误删
      # ----------------------------------------------------------------------
      - name: 3. 拉取 GCC 4.9 交叉工具链并自检
        run: |
          set -e
          git clone --depth 1 -b brillo-m9-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$RUNNER_TEMP/gcc49"

          GCC_PATH="$(find "$RUNNER_TEMP/gcc49" -maxdepth 3 -type f -name 'aarch64-linux-android-gcc' | head -1)"
          if [ -z "$GCC_PATH" ]; then
            echo "::error::工具链包里没找到 aarch64-linux-android-gcc"
            find "$RUNNER_TEMP/gcc49" -maxdepth 2 | head -30
            exit 1
          fi

          TC_PREFIX="$(dirname "$GCC_PATH")/aarch64-linux-android-"
          echo "TC_PREFIX=$TC_PREFIX" >> "$GITHUB_ENV"
          echo "工具链前缀: $TC_PREFIX"
          "${TC_PREFIX}gcc" --version | head -1
          "${TC_PREFIX}ld"  --version | head -1

      # ----------------------------------------------------------------------
      # 4. KernelSU（仅 ksu 变体，尽力而为；失败就回滚，编原版）
      #    4.9 属非 GKI，KernelSU 主线支持有限，所以这一步绝不阻塞整单
      # ----------------------------------------------------------------------
      - name: 4. [ksu] 尝试集成 KernelSU
        if: matrix.variant == 'ksu'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          if ! curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" -o "$RUNNER_TEMP/ksu-setup.sh"; then
            echo "::warning::KernelSU setup 脚本下载失败，跳过集成，直接编原版内核"
            exit 0
          fi
          if bash "$RUNNER_TEMP/ksu-setup.sh" main; then
            echo "KernelSU 集成完成，后续编译若失败会自动回滚"
          else
            echo "::warning::KernelSU 在 4.9 上集成失败（非 GKI 支持有限），回滚后编原版内核"
            git checkout -- . || true
            git clean -fdq || true
          fi

      # ----------------------------------------------------------------------
      # 5. 配置 + 编译（三层兜底：EVENT_TRACK / VIVO_PROJECT_MODEL / KSU 回滚）
      # ----------------------------------------------------------------------
      - name: 5. 配置并编译
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$TC_PREFIX"
          # 版本串里的编译者与原机保持一致：compiler@comsz01078157
          export KBUILD_BUILD_USER="compiler"
          export KBUILD_BUILD_HOST="comsz01078157"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=Asia/Shanghai date +'%a %b %d %H:%M:%S CST %Y')"

          if [ "${{ github.event.inputs.ignore_warnings }}" = "true" ]; then
            export KCFLAGS="-w"
          fi

          JOBS="$(nproc)"
          DEFCONFIG="y11_defconfig"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::仓库里找不到 arch/arm64/configs/$DEFCONFIG"
            ls arch/arm64/configs/ | head -40
            exit 1
          fi

          configure() {
            make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" "$DEFCONFIG" > /dev/null

            # 关键修复 1：track_event 的实现开关
            scripts/config --file out/.config -e EVENT_TRACK
            # 关键修复 2：保住 -perf，不要让 git 描述污染版本串
            scripts/config --file out/.config -d LOCALVERSION_AUTO

            # 导出全量符号：KALLSYMS_ALL 在 4.9 的 Kconfig 里依赖 DEBUG_KERNEL + KALLSYMS
            # 少开任何一个，olddefconfig 都会把 KALLSYMS_ALL 悄悄清掉
            if [ "${{ github.event.inputs.kallsyms_all }}" = "true" ]; then
              scripts/config --file out/.config -e DEBUG_KERNEL
              scripts/config --file out/.config -e KALLSYMS
              scripts/config --file out/.config -e KALLSYMS_ALL
            fi

            # 4.9 的 kconfig 没有 olddefconfig 目标（4.16 才引入），降级到 silentoldconfig
            make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" olddefconfig > /dev/null 2>&1 \
              || make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" silentoldconfig > /dev/null 2>&1 \
              || true

            # 配置整理若因依赖不满足把它丢掉，就硬写回去
            if ! grep -q '^CONFIG_EVENT_TRACK=y' out/.config; then
              echo "::warning::EVENT_TRACK 依赖链未满足，直接写入 .config"
              echo 'CONFIG_EVENT_TRACK=y' >> out/.config
            fi
            if grep -q '^CONFIG_LOCALVERSION_AUTO=y' out/.config; then
              sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' out/.config
            fi
            if [ "${{ github.event.inputs.kallsyms_all }}" = "true" ] && ! grep -q '^CONFIG_KALLSYMS_ALL=y' out/.config; then
              echo "::warning::KALLSYMS_ALL 依赖没满足，强制写回 .config"
              {
                echo 'CONFIG_DEBUG_KERNEL=y'
                echo 'CONFIG_KALLSYMS=y'
                echo 'CONFIG_KALLSYMS_ALL=y'
              } >> out/.config
            fi

            echo "--- 关键配置 ---"
            grep -E '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_EVENT_TRACK=|CONFIG_MODVERSIONS=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_DEBUG_KERNEL=)' out/.config || true
            grep -E '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || true
          }

          configure

          ok=0
          echo "=== 第一次编译 ==="
          if make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" -j"$JOBS" Image.gz 2>&1 | tee build.log; then
            ok=1
          fi

          # 兜底 A：EVENT_TRACK 没生效 -> 走原厂宏把调用点排除掉重编
          if [ "$ok" -eq 0 ] && grep -q 'track_event' build.log; then
            echo "::warning::track_event 仍未定义，改用 VIVO_PROJECT_MODEL 路径重编"
            export KCFLAGS="${KCFLAGS:-} -DVIVO_PROJECT_MODEL"
            make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" clean > /dev/null 2>&1 || true
            echo "=== 兜底编译 A ==="
            if make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" -j"$JOBS" Image.gz 2>&1 | tee build.log; then
              ok=1
            fi
          fi

          # 兜底 B：KernelSU 集成导致编不过 -> 回滚源码树，编原版
          if [ "$ok" -eq 0 ] && [ "${{ matrix.variant }}" = "ksu" ]; then
            echo "::warning::KSU 变体编译失败，回滚 KernelSU 后编原版内核"
            git checkout -- . || true
            git clean -fdq || true
            unset KCFLAGS
            if [ "${{ github.event.inputs.ignore_warnings }}" = "true" ]; then
              export KCFLAGS="-w"
            fi
            configure
            echo "=== 兜底编译 B（无 KernelSU） ==="
            if make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" -j"$JOBS" Image.gz 2>&1 | tee build.log; then
              ok=1
            fi
          fi

          if [ "$ok" -eq 0 ]; then
            echo "::error::内核编译失败，最后 60 行日志如下"
            tail -60 build.log || true
            exit 1
          fi

          # dtb 合并版（部分树没这个目标，失败不影响 Image.gz）
          echo "=== 尝试生成 Image.gz-dtb ==="
          if ! make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" -j"$JOBS" Image.gz-dtb > dtb.log 2>&1; then
            echo "::warning::Image.gz-dtb 未生成（该树可能不带此目标），仅提供 Image.gz"
            tail -20 dtb.log || true
          fi

          ls -lh out/arch/arm64/boot/Image* || true

      # ----------------------------------------------------------------------
      # 6. 核对产物：版本串、文件大小、实际用的 config
      # ----------------------------------------------------------------------
      - name: 6. 核对产物
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE="$TC_PREFIX"

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::out/arch/arm64/boot/Image.gz 不存在"
            ls -l out/arch/arm64/boot/ || true
            exit 1
          fi

          REL="$(make O=out ARCH=arm64 CROSS_COMPILE="$TC_PREFIX" kernelrelease 2>/dev/null | tail -1)"
          REL="${REL:-4.9.227-perf+}"
          echo "内核版本串: $REL"

          # 从 vmlinux 里把实际版本串抓出来，编错配置一眼能看出来
          strings out/vmlinux 2>/dev/null | grep -m1 'Linux version' || true

          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz "artifacts/PD1930CF_kernel_${REL}_Image.gz"
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb "artifacts/PD1930CF_kernel_${REL}_Image.gz-dtb"
          fi
          cp out/.config artifacts/kernel_config_used.txt
          strings out/vmlinux 2>/dev/null | grep -m1 'Linux version' > artifacts/version.txt || echo "$REL" > artifacts/version.txt

          # ---- 全量符号表 ----
          # vmlinux 的 symtab 本来就有 static/局部符号，System.map 就是它按地址排好的全量清单
          if [ -f out/vmlinux ]; then
            cp out/System.map artifacts/System.map 2>/dev/null || \
              "${TC_PREFIX}nm" -n out/vmlinux > artifacts/System.map 2>/dev/null || true

            "${TC_PREFIX}nm" -n --defined-only out/vmlinux > artifacts/kallsyms_all.txt 2>/dev/null \
              || nm -n --defined-only out/vmlinux > artifacts/kallsyms_all.txt 2>/dev/null || true

            if [ -s artifacts/kallsyms_all.txt ]; then
              echo "符号总数: $(wc -l < artifacts/kallsyms_all.txt)"
              echo "其中局部/static 符号: $(awk '$2 ~ /^[a-z]$/ {n++} END{print n+0}' artifacts/kallsyms_all.txt)"
            fi

            # 内核运行时能查到的符号（/proc/kallsyms 全量与否）看这一个开关
            if grep -q '^CONFIG_KALLSYMS_ALL=y' out/.config; then
              echo "kallsyms 全量导出：已开启（运行时 /proc/kallsyms 含 static 符号）"
            else
              echo "::warning::CONFIG_KALLSYMS_ALL 未开启，运行时 /proc/kallsyms 只有全局符号"
            fi

            # vmlinux 带完整 symtab，压一下；太大就只留符号表
            gzip -9 -c out/vmlinux > artifacts/vmlinux.gz 2>/dev/null || true
            if [ -s artifacts/vmlinux.gz ]; then
              VSIZE=$(stat -c%s artifacts/vmlinux.gz)
              echo "vmlinux.gz: $((VSIZE/1024/1024)) MB"
              if [ "$VSIZE" -gt 314572800 ]; then
                echo "::warning::vmlinux.gz 超过 300MB，不上传，只保留 System.map"
                rm -f artifacts/vmlinux.gz
              fi
            fi
          fi

          echo "=== 产物 ==="
          ls -lh artifacts

      # ----------------------------------------------------------------------
      # 7. 上传
      # ----------------------------------------------------------------------
      - name: 7. 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: y11-kernel-${{ matrix.variant }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
